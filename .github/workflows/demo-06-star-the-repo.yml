name: Demo 06 - Star The Repo

on:
  workflow_dispatch:
  watch:
    types:
      - started

jobs:
  change-the-bulb-color:
    name: Change the Demo Bulb Color
    runs-on: ubuntu-latest
    
    steps:
      - name: Find Random Color
        id: find-random-color
        run: |
          RN=$(( $RANDOM % 9 + 1 ))
          case $RN in
            1)
              COLOR="white"
              ;;
            2)
              COLOR="red"
              ;;
            3)
              COLOR="orange"
              ;;
            4)
              COLOR="yellow"
              ;;
            5)
              COLOR="cyan"
              ;;
            6)
              COLOR="green"
              ;;
            7)
              COLOR="blue"
              ;;
            8)
              COLOR="purple"
              ;;
            9)
              COLOR="pink"
              ;;
            *)
              COLOR="THIS IS BAD"
              ;;
          esac

          echo $RN
          echo $COLOR
          
          # This is the modernized output command!
          echo "bulbcolor=$COLOR" >> $GITHUB_OUTPUT
    
      - name: Change the bulb color
        run: |
          # This is the simulated logging to bypass the broken API!
          echo "Simulating API call to LIFX bulb..."
          echo "Successfully changed the virtual bulb color to: ${{ steps.find-random-color.outputs.bulbcolor }}"
